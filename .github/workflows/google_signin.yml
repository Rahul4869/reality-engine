name: Google Sign-in (one time)
on:
  workflow_dispatch:
    inputs:
      pasted_address:
        description: "Leave EMPTY the first time (shows link 1 and link 2). Then paste the full address from the page that failed to load, once for each link."
        required: false
jobs:
  signin:
    runs-on: ubuntu-latest
    env:
      G_CLIENT_ID: ${{ secrets.G_CLIENT_ID }}
      G_CLIENT_KEY: ${{ secrets.G_CLIENT_KEY }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      G_REFRESH: ${{ secrets.G_REFRESH }}
      PASTED: ${{ github.event.inputs.pasted_address }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - run: python tools/google_signin.py "$PASTED"
