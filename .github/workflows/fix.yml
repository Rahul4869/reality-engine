name: Fix held video
# You get an email when a finished video fails the final quality check (it is NOT uploaded). The email has a link that opens a pre-filled issue titled
# "FIX EP...". Pressing "Submit new issue" starts this robot: it restores the saved pictures/clips from your private Drive, repairs, re-checks, and schedules
# the video ONLY if it now passes. Only issues opened by the repository owner are accepted; the title must be exactly "FIX " + an episode id.
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  fix:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'FIX EP')
    runs-on: ubuntu-latest
    timeout-minutes: 340
    concurrency:
      group: produce            # shares the lock with normal production: never two renders at once
      cancel-in-progress: false
    env:
      SHEET_ID: ${{ secrets.SHEET_ID }}
      G_CLIENT_ID: ${{ secrets.G_CLIENT_ID }}
      G_CLIENT_KEY: ${{ secrets.G_CLIENT_KEY }}
      G_REFRESH: ${{ secrets.G_REFRESH }}
      G_REFRESH_DRIVE: ${{ secrets.G_REFRESH_DRIVE }}
      ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
      GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
      META_PAGE_KEY: ${{ secrets.META_PAGE_KEY }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      GH_REPO: ${{ github.repository }}
      WA_TOKEN: ${{ secrets.WA_TOKEN }}
      WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
      WA_WABA_ID: ${{ secrets.WA_WABA_ID }}
      OWNER_WA: ${{ secrets.OWNER_WA }}
      GH_MERGE_TOKEN: ${{ secrets.GH_MERGE_TOKEN }}
      AA_API_KEY: ${{ secrets.AA_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Tools
        run: |
          sudo apt-get update -y -qq && sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core > /dev/null
          mkdir -p fonts
          curl -sfL -o fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf || true
          curl -sfL -o fonts/Inter-Bold.ttf "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf" || true
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: models-v1
      - name: Python packages
        run: |
          pip install -q "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt
      - name: Repair, re-check, schedule
        run: python -m whatifs.cli fixheld "$ISSUE_TITLE"
      - name: Close the request
        if: always()
        run: gh issue close "$ISSUE_NUMBER" --repo "$GH_REPO" --comment "Done. Check your email and the Episodes tab for the result." || true
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: error-${{ github.run_id }}
          path: last_error.txt
          retention-days: 3
