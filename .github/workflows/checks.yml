name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      repeat_suite:
        description: "v9.1: run the full unit-test suite this many times (repeatability evidence); 1 = normal"
        default: "1"
jobs:
  guard_and_rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: pip install -q "numpy>=1.26,<2.1" "opencv-python-headless>=4.9,<5" "pillow>=10,<13" "soundfile>=0.12,<0.14" "requests>=2.31,<3" pytest pyyaml python-docx "cryptography>=42,<46"
      - name: Restore code from Word copies (this job only, nothing is committed)
        run: |
          python - <<'EOF'
          import glob, os, docx
          n = 0
          for d in glob.glob("**/*.docx", recursive=True):
              if d.replace(os.sep, "/").split("/")[0] not in ("whatifs", "tools", "tests"): continue      # only the code folders
              lines = [p.text for p in docx.Document(d).paragraphs]
              with open(d[:-5] + ".py", "w", encoding="utf-8", newline="\n") as f:
                  f.write("\n".join(lines))
              os.remove(d); n += 1
          print("restored", n, "files")
          EOF
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dashboard server and page (v9.4b)
        run: |
          node --test mission_control/test_worker.mjs
      - name: Plan Guard
        run: python tools/plan_guard.py
      - name: Unit tests (hooks, research evidence, cut map, failure paths; no keys, no network)
        env:
          WI_NO_SKIPS: "1"          # v12 B0b: on this run a skipped test is a failure (tests/skip_policy.py)
        run: |
          set +e
          python -m pytest tests -q 2>&1 | tee "$RUNNER_TEMP/unit.log"; rc=${PIPESTATUS[0]}
          python tools/ci_report.py unit "$RUNNER_TEMP/unit.log" "$rc"          # v12 B0b: the cause (or the totals) as an annotation on the run page, readable without a sign-in
          exit "$rc"
      - name: Repeat the unit tests (manual run with repeat_suite > 1 only)
        if: github.event_name == 'workflow_dispatch'
        env:
          REPEAT: ${{ github.event.inputs.repeat_suite }}
          WI_NO_SKIPS: "1"
        run: |
          n="${REPEAT:-1}"; i=1
          while [ "$i" -lt "$n" ]; do i=$((i+1)); echo "suite run $i of $n"; python -m pytest tests -q -p no:cacheprovider; done
      - name: Free rehearsal (fake AI, fake images, full pipeline)
        env:
          WI_FAKE: "1"
          WI_SMALL: "1"
          WI_WORK: rh
        run: |
          set +e
          python -m whatifs.cli rehearsal 2>&1 | tee "$RUNNER_TEMP/rehearsal.log"; rc=${PIPESTATUS[0]}
          python tools/ci_report.py rehearsal "$RUNNER_TEMP/rehearsal.log" "$rc"          # v12 B0b: the episode id + failed checks as annotations (the id reproduces the run: tools/sweep.py)
          exit "$rc"
      - name: Change-ready email with a one-click merge link (pull requests only, after every check above passed)
        if: github.event_name == 'pull_request' && success()
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          G_CLIENT_ID: ${{ secrets.G_CLIENT_ID }}
          G_CLIENT_KEY: ${{ secrets.G_CLIENT_KEY }}
          G_REFRESH: ${{ secrets.G_REFRESH }}
          G_REFRESH_DRIVE: ${{ secrets.G_REFRESH_DRIVE }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          GH_REPO: ${{ github.repository }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
          WA_WABA_ID: ${{ secrets.WA_WABA_ID }}
          OWNER_WA: ${{ secrets.OWNER_WA }}
          GH_MERGE_TOKEN: ${{ secrets.GH_MERGE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: python -m whatifs.cli prready || true
