name: WhatsApp setup
# v10: creates the WhatsApp utility template once (Meta approves it in minutes to hours) and sends a test message. By hand, during setup.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHEET_ID: ${{ secrets.SHEET_ID }}
      G_CLIENT_ID: ${{ secrets.G_CLIENT_ID }}
      G_CLIENT_KEY: ${{ secrets.G_CLIENT_KEY }}
      G_REFRESH: ${{ secrets.G_REFRESH }}
      G_REFRESH_DRIVE: ${{ secrets.G_REFRESH_DRIVE }}
      WA_TOKEN: ${{ secrets.WA_TOKEN }}
      WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
      WA_WABA_ID: ${{ secrets.WA_WABA_ID }}
      OWNER_WA: ${{ secrets.OWNER_WA }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q requests "numpy>=1.26,<2.1"
      - run: python -m whatifs.cli wa_templates
