name: Pipeline
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [tick]                       # v11: the Cloudflare watchdog's backup clock (GitHub cron can be hours late or dropped)
permissions:
  contents: read
jobs:
  tick:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write    # v11.1: ONLY the tick may start the Shorts / Case Files jobs (least privilege)
    concurrency:
      group: tick
      cancel-in-progress: false
    timeout-minutes: 15
    env:
      SHEET_ID: ${{ secrets.SHEET_ID }}
      G_CLIENT_ID: ${{ secrets.G_CLIENT_ID }}
      G_CLIENT_KEY: ${{ secrets.G_CLIENT_KEY }}
      G_REFRESH: ${{ secrets.G_REFRESH }}
      G_REFRESH_DRIVE: ${{ secrets.G_REFRESH_DRIVE }}
      ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
      GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
      META_PAGE_KEY: ${{ secrets.META_PAGE_KEY }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
      CF_KV_TOKEN: ${{ secrets.CF_KV_TOKEN }}
      GH_REPO: ${{ github.repository }}
      # v11 audit fix: owner cards go by WhatsApp; the tick can start Shorts / Case Files jobs; optional tool-scout key
      WA_TOKEN: ${{ secrets.WA_TOKEN }}
      WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
      WA_WABA_ID: ${{ secrets.WA_WABA_ID }}
      OWNER_WA: ${{ secrets.OWNER_WA }}
      GH_MERGE_TOKEN: ${{ secrets.GH_MERGE_TOKEN }}
      GH_ACTIONS_TOKEN: ${{ github.token }}
      AA_API_KEY: ${{ secrets.AA_API_KEY }}
    outputs:
      action: ${{ steps.t.outputs.action }}
      slot: ${{ steps.t.outputs.slot }}
      episode: ${{ steps.t.outputs.episode }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q "requests>=2.31,<3" "numpy>=1.26,<2.1" "pillow>=10,<13"        # v10.3: chart images for the WhatsApp briefs
      - id: t
        run: python -m whatifs.cli tick
  produce:
    needs: tick
    if: needs.tick.outputs.slot != ''
    runs-on: ubuntu-latest
    timeout-minutes: 340
    concurrency:
      group: produce
      cancel-in-progress: false
    env:
      SHEET_ID: ${{ secrets.SHEET_ID }}
      G_CLIENT_ID: ${{ secrets.G_CLIENT_ID }}
      G_CLIENT_KEY: ${{ secrets.G_CLIENT_KEY }}
      G_REFRESH: ${{ secrets.G_REFRESH }}
      G_REFRESH_DRIVE: ${{ secrets.G_REFRESH_DRIVE }}
      ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
      GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
      META_PAGE_KEY: ${{ secrets.META_PAGE_KEY }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      GH_REPO: ${{ github.repository }}
      # v11 audit fix: owner cards go by WhatsApp; the tick can start Shorts / Case Files jobs; optional tool-scout key
      WA_TOKEN: ${{ secrets.WA_TOKEN }}
      WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
      WA_WABA_ID: ${{ secrets.WA_WABA_ID }}
      OWNER_WA: ${{ secrets.OWNER_WA }}
      GH_MERGE_TOKEN: ${{ secrets.GH_MERGE_TOKEN }}
      AA_API_KEY: ${{ secrets.AA_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Tools
        run: |
          sudo apt-get update -y -qq && sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core > /dev/null
          mkdir -p fonts
          curl -sfL -o fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf || true
          curl -sfL -o fonts/Inter-Bold.ttf "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf" || true
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: models-v1
      - name: Python packages
        run: |
          pip install -q "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt
          pip freeze | grep -iE "^(torch|kokoro|transformers|numpy|opencv-python-headless|soundfile|pillow)==" || true
      - name: Produce the episode
        env:
          SLOT: ${{ needs.tick.outputs.slot }}
        run: python -m whatifs.cli produce "$SLOT"
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: error-${{ github.run_id }}
          path: last_error.txt
          retention-days: 3
  release:
    needs: tick
    if: startsWith(needs.tick.outputs.action, 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      SHEET_ID: ${{ secrets.SHEET_ID }}
      G_CLIENT_ID: ${{ secrets.G_CLIENT_ID }}
      G_CLIENT_KEY: ${{ secrets.G_CLIENT_KEY }}
      G_REFRESH: ${{ secrets.G_REFRESH }}
      G_REFRESH_DRIVE: ${{ secrets.G_REFRESH_DRIVE }}
      ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
      GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
      META_PAGE_KEY: ${{ secrets.META_PAGE_KEY }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      GH_REPO: ${{ github.repository }}
      # v11 audit fix: owner cards go by WhatsApp; the tick can start Shorts / Case Files jobs; optional tool-scout key
      WA_TOKEN: ${{ secrets.WA_TOKEN }}
      WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
      WA_WABA_ID: ${{ secrets.WA_WABA_ID }}
      OWNER_WA: ${{ secrets.OWNER_WA }}
      GH_MERGE_TOKEN: ${{ secrets.GH_MERGE_TOKEN }}
      AA_API_KEY: ${{ secrets.AA_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Tools
        run: |
          sudo apt-get update -y -qq && sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core > /dev/null
          mkdir -p fonts
          curl -sfL -o fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf || true
          curl -sfL -o fonts/Inter-Bold.ttf "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf" || true
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: models-v1
      - name: Python packages
        run: |
          pip install -q "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt
      - name: Release the reel
        env:
          RELEASE_ACTION: ${{ needs.tick.outputs.action }}
          RELEASE_EPISODE: ${{ needs.tick.outputs.episode }}
        run: python -m whatifs.cli "$RELEASE_ACTION" "$RELEASE_EPISODE"
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: error-${{ github.run_id }}
          path: last_error.txt
          retention-days: 3
