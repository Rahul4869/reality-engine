name: sheets
# v9: the ONE-TIME character sheets (manual only; a hard lifetime image cap is enforced in code). Never scheduled.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sheets:
    runs-on: ubuntu-latest
    concurrency:
      group: sheet-heavy          # v9.4a (ORCHESTRA): one Sheet-heavy job at a time (queue, never cancel)
      cancel-in-progress: false
    timeout-minutes: 40
    env:
      SHEET_ID: ${{ secrets.SHEET_ID }}
      G_CLIENT_ID: ${{ secrets.G_CLIENT_ID }}
      G_CLIENT_KEY: ${{ secrets.G_CLIENT_KEY }}
      G_REFRESH: ${{ secrets.G_REFRESH }}
      G_REFRESH_DRIVE: ${{ secrets.G_REFRESH_DRIVE }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      GH_REPO: ${{ github.repository }}
      WA_TOKEN: ${{ secrets.WA_TOKEN }}
      WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
      WA_WABA_ID: ${{ secrets.WA_WABA_ID }}
      OWNER_WA: ${{ secrets.OWNER_WA }}
      GH_MERGE_TOKEN: ${{ secrets.GH_MERGE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      AA_API_KEY: ${{ secrets.AA_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q requests "numpy>=1.26,<2.1" pillow opencv-python-headless
      - name: Make the missing sheet images (inside the lifetime cap)
        run: python -m whatifs.cli sheets
