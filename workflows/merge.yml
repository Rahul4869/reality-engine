name: Merge change
# v8.9 one-click merge. When a change (from Claude Code or the Repair Bot) passes every check, you get an email with a link that opens a pre-filled
# issue "MERGE #<number>". Pressing "Submit new issue" starts this robot: it merges the change ONLY if every check on it is green, then closes the issue.
# Only issues opened by the repository owner are accepted. The next half-hourly Pipeline run then uses the new code by itself.
on:
  issues:
    types: [opened]
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  merge:
    if: "github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'MERGE #')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Merge only if every check is green
        run: |
          N=$(printf '%s' "$ISSUE_TITLE" | sed -n 's/^MERGE #\([0-9][0-9]*\)[[:space:]]*$/\1/p')
          if [ -z "$N" ]; then gh issue close "$ISSUE_NUMBER" --repo "$GH_REPO" --comment "The title must be exactly: MERGE #<number>. Nothing was merged."; exit 0; fi
          if ! gh pr checks "$N" --repo "$GH_REPO" > /dev/null 2>&1; then
            gh issue close "$ISSUE_NUMBER" --repo "$GH_REPO" --comment "Change #$N is not merged: a check failed or is still running. Wait for the 'Change ready' email, then click again."; exit 0
          fi
          if gh pr merge "$N" --repo "$GH_REPO" --squash --delete-branch; then
            gh issue close "$ISSUE_NUMBER" --repo "$GH_REPO" --comment "Merged #$N. The next Pipeline run (within 30 minutes) uses the new code. Nothing else to do."
          else
            gh issue close "$ISSUE_NUMBER" --repo "$GH_REPO" --comment "GitHub refused the automatic merge of #$N (changes to workflow files need your own click). Open the pull request and press the green Merge button."
          fi
