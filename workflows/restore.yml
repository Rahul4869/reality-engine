name: Restore code
on:
  push:
    paths:
      - "whatifs/*.docx"
      - "tools/*.docx"
      - "tests/*.docx"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q python-docx
      - name: Turn every Word copy back into its code file (exact text, line by line)
        run: |
          python - <<'EOF'
          import glob, os, docx
          n = 0
          for d in glob.glob("**/*.docx", recursive=True):
              if d.replace(os.sep, "/").split("/")[0] not in ("whatifs", "tools", "tests"): continue      # only the code folders
              lines = [p.text for p in docx.Document(d).paragraphs]
              with open(d[:-5] + ".py", "w", encoding="utf-8", newline="\n") as f:
                  f.write("\n".join(lines))
              os.remove(d); n += 1
          print("restored", n, "files")
          EOF
      - name: Save
        run: |
          git config user.name restore-bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git commit -m "restore code files from Word copies" || echo "nothing to restore"
          git push
